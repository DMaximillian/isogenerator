name: Fast Upload via Cloud Link
on:
  workflow_dispatch:

jobs:
  upload-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Build ISO (Instant from Cache)
        run: |
          # Запускаем сборку — Docker мгновенно возьмет готовый ISO из кэша за секунд 30
          docker run --rm --privileged \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/build" \
            -w /build \
            ghcr.io/blue-build/cli:v0.9.5 \
            bluebuild generate-iso \
            --iso-name "bazzite-deck-43.20260420.iso" \
            image "ghcr.io/ublue-os/bazzite-deck:43.20260420"

      - name: Upload to Web Share
        run: |
          echo "=== Начинаем быструю отправку на файлообменник ==="
          # Находим созданный файл во всем рабочем пространстве
          ISO_FILE=$(find ${{ github.workspace }} -name "*.iso" | head -n 1)
          
          if [ -n "$ISO_FILE" ]; then
            echo "Файл успешно найден! Загружаем на bashupload.com..."
            # Отправляем файл в облако и выводим прямую ссылку на скачивание
            curl -T "$ISO_FILE" https://bashupload.com
          else
            echo "Ошибка: Файл не найден на диске раннера!"
          fi
