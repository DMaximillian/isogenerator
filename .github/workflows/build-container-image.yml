name: Generate Bazzite 43 ISO
on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free Disk Space (Bash script)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/swift
          sudo rm -rf /root/.dotnet
          sudo rm -rf /opt/pipx
          sudo rm -rf /usr/local/share/vcpkg
          docker image prune --all --force

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build ISO using BlueBuild (Official Native Method)
        uses: blue-build/github-action@v1
        with:
          # Этот плагин автоматически развернет установщик Fedora 43 
          # и зашьет внутрь него указанный нами образ Bazzite-Deck
          recipe: '' 
          cli_version: 'v0.9.5'
          build_with: 'docker'
          is_iso: true
          iso_image_tag: '43.20260420'
          iso_image_name: 'bazzite-deck'
          iso_image_repo: 'ghcr.io/ublue-os'
          iso_fedora_version: '43'

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bazzite-deck-43.20260420-ISO
          path: |
            *.iso
            output/*.iso
          retention-days: 2
