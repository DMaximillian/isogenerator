name: Generate Bazzite ISO
on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Maximize Disk Space
        uses: easimon/minimize-disk-space@v1
        with:
          root-reserve-mb: 2048
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Build ISO using Isogenerator 43
        run: |
          mkdir -p ${{ github.workspace }}/output
          docker run --rm --privileged \
            -v "${{ github.workspace }}/output:/build-container-installer/output" \
            ghcr.io/ublue-os/isogenerator:43 \
            ghcr.io/ublue-os/bazzite-deck:43.20260420

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bazzite-iso-43.20260420
          path: ${{ github.workspace }}/output/*.iso
          retention-days: 2
