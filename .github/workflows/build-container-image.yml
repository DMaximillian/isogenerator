name: Generate Bazzite 43 ISO
on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free Disk Space (Bash script)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/swift
          sudo rm -rf /root/.dotnet
          sudo rm -rf /opt/pipx
          sudo rm -rf /usr/local/share/vcpkg
          docker image prune --all --force

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build ISO via BlueBuild CLI
        run: |
          mkdir -p ${{ github.workspace }}/output
          
          # Мы вызываем бинарник bluebuild и используем правильный синтаксис:
          # generate-iso --iso-name [имя] image [ссылка_на_образ:тег]
          docker run --rm --privileged \
            -v "${{ github.workspace }}/output:/build" \
            ghcr.io/blue-build/cli:v0.9.5 \
            bluebuild generate-iso \
            --iso-name "bazzite-deck-43.20260420.iso" \
            image "ghcr.io/ublue-os/bazzite-deck:43.20260420" \
            --output "/build"

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bazzite-deck-43.20260420-ISO
          path: ${{ github.workspace }}/output/*.iso
          retention-days: 2
