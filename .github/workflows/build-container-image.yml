name: Generate Bazzite 43 ISO
on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free Disk Space (Bash script)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/swift
          sudo rm -rf /root/.dotnet
          sudo rm -rf /opt/pipx
          sudo rm -rf /usr/local/share/vcpkg
          docker image prune --all --force

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build ISO via BlueBuild CLI
        run: |
          mkdir -p ${{ github.workspace }}/build
          
          docker run --rm --privileged \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}/build:/build" \
            -w /build \
            ghcr.io/blue-build/cli:v0.9.5 \
            bluebuild generate-iso \
            --iso-name "bazzite-deck-43.20260420.iso" \
            image "ghcr.io/ublue-os/bazzite-deck:43.20260420"

      - name: Debug Output Tree (Проверка папок)
        run: |
          echo "=== Проверяем, где лежат файлы на сервере ==="
          ls -R ${{ github.workspace }}/build || true

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bazzite-deck-43.20260420-ISO
          # Маска '**/*' заставит плагин выгрести все файлы из папки build и её подпапок
          path: |
            ${{ github.workspace }}/build/**/*.iso
            ${{ github.workspace }}/build/**/*.iso-CHECKSUM
          retention-days: 2
