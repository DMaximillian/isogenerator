name: Generate Bazzite ISO
on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free Disk Space (Bash script)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/swift
          sudo rm -rf /root/.dotnet
          sudo rm -rf /opt/pipx
          sudo rm -rf /usr/local/share/vcpkg
          docker image prune --all --force

      - name: Build ISO using Isogenerator 43
        run: |
          mkdir -p ${{ github.workspace }}/output
          docker run --rm --privileged \
            -v "${{ github.workspace }}/output:/build-container-installer/output" \
            ghcr.io/ublue-os/isogenerator:43 \
            ghcr.io/ublue-os/bazzite-deck:43.20260420

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bazzite-iso-43.20260420
          path: ${{ github.workspace }}/output/*.iso
          retention-days: 2
