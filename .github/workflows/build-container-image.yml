name: Generate Bazzite ISO
on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Maximize Build Space (Ublue Clean)
        uses: ublue-os/remove-unwanted-software@main
        with:
          extra-squeeze: 'true'

      - name: Build ISO using Isogenerator 43
        run: |
          mkdir -p ${{ github.workspace }}/output
          docker run --rm --privileged \
            -v "${{ github.workspace }}/output:/build-container-installer/output" \
            ghcr.io/ublue-os/isogenerator:43 \
            ghcr.io/ublue-os/bazzite-deck:43.20260420

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bazzite-iso-43.20260420
          path: ${{ github.workspace }}/output/*.iso
          retention-days: 2
